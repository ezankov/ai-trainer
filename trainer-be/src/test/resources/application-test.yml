spring:
  datasource:
    # INIT creates the 'trainer' schema so the User entity (schema="trainer") resolves correctly
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS trainer
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: trainer

  flyway:
    enabled: false   # Use Hibernate's ddl-auto in tests; Flyway is disabled

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:disabled}
      enabled: false
    vertex:
      ai:
        gemini:
          enabled: false
          project-id: test-project

  autoconfigure:
    exclude:
      - org.springframework.ai.model.vertexai.autoconfigure.gemini.VertexAiGeminiChatAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration

trainer:
  ai:
    chatgpt:
      enabled: false
    claude:
      enabled: false
    gemini:
      enabled: false
    kiro:
      enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256
    expiration-ms: 86400000
