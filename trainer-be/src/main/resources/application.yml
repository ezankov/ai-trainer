spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/personal_ai_trainer?currentSchema=trainer
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: trainer

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trainer              # Flyway will create the schema if it doesn't exist
    default-schema: trainer
    baseline-on-migrate: false    # set to true only when migrating an existing schema

server:
  port: 8080

logging:
  level:
    root: INFO
    com.trainer: DEBUG
    org.flywaydb: INFO
