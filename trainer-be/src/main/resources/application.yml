spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/backend_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false    # set to true only when migrating an existing schema

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.backend: DEBUG
    org.flywaydb: INFO
